name: Exécutable Windows

on:
  push:
    branches-ignore: ["dependabot/**"]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Construction de AutocliqueIA.exe
        run: python tools/build_exe.py

      - name: Autotest de l'exécutable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\AutocliqueIA.exe" -ArgumentList "--selftest" -PassThru -Wait
          Get-Content "$env:TEMP\autoclique-selftest.txt"
          if ($process.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: AutocliqueIA-windows
          path: dist/AutocliqueIA.exe

      - name: Publication de la version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AutocliqueIA.exe
