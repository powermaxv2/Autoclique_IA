name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Écran virtuel (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Tests (Linux, avec vraie souris et vrai clavier sur Xvfb)
        if: runner.os == 'Linux'
        env:
          AUTOCLIQUE_INTEGRATION: "1"
        run: xvfb-run -a -s "-screen 0 1400x900x24" python -m pytest -o addopts="" -v

      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -o addopts="" -v

      - name: Autotest de l'interface
        if: runner.os == 'Windows'
        run: python -m autoclique --selftest
